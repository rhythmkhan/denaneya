      - amountPaisa
      - reason
      properties:
        amountPaisa:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '50000'
        reason:
          type: string
          example: Customer requested order cancellation
        metadata:
          type: object
          additionalProperties: true
    RefundResponse:
      type: object
      required:
      - id
