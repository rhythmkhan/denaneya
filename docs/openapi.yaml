        deviceId:
          type: string
        model:
          type: string
        osVersion:
          type: string
        appVersion:
          type: string
        batteryLevel:
          type: integer
        isCharging:
          type: boolean
        networkType:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - REVOKED
        lastHeartbeatAt:
          type: string
          format: date-time
    DevicePairRequest:
      type: object
      required:
      - deviceId
      - pairingToken
      - publicKeyHex
      - model
      - osVersion
      - appVersion
      properties:
        deviceId:
          type: string
          example: dev_4b8f9e01
        pairingToken:
          type: string
          example: pair_99f8d1c7a2b3c4d5
        publicKeyHex:
          type: string
          example: 3059301306072a8648ce3d020106082a8648ce3d03010703420004...
        model:
          type: string
          example: Samsung Galaxy A14
        osVersion:
          type: string
          example: Android 14 (API 34)
        appVersion:
          type: string
          example: 1.0.0
        simSlots:
          type: array
          items:
            type: object
            properties:
              slot:
                type: integer
              carrier:
                type: string
              msisdn:
                type: string
    IngestSmsRequest:
      type: object
      required:
      - deviceId
      - sequenceNumber
      - nonce
      - timestamp
      - eventType
      - payload
      - signature
      properties:
        deviceId:
          type: string
        sequenceNumber:
          type: integer
        nonce:
          type: string
          format: uuid
        timestamp:
          type: integer
        eventType:
          type: string
          example: SMS_RECEIVED
        payload:
          type: object
          required:
          - sender
          - messageText
          - receivedAt
          properties:
            sender:
              type: string
              example: bKash
            messageText:
              type: string
              example: You have received Tk 1,500.00 from 01712345678. Fee Tk 0.00.
                Balance Tk 45,210.50. TrxID 9K76TRX01 at 14/09/2026 02:05
            receivedAt:
              type: integer
            simSlot:
              type: integer
            batteryLevel:
              type: integer
        signature:
          type: string
          description: ECDSA P-256 Base64 signature
    IngestSmsResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - PROCESSED
          - DUPLICATE_IGNORED
        smsId:
          type: string
        provider:
          type: string
        trxId:
          type: string
        matchedPaymentId:
          type: string
        message:
          type: string
    HeartbeatRequest:
      type: object
      required:
      - deviceId
      - sequenceNumber
      - batteryLevel
      - networkType
      properties:
        deviceId:
          type: string
        sequenceNumber:
          type: integer
        batteryLevel:
          type: integer
        isCharging:
          type: boolean
        networkType:
          type: string
    GatewayHealthResponse:
      type: object
      required:
      - status
      - timestamp
      - gateways
      properties:
        status:
          type: string
          enum:
          - UP
          - DEGRADED
          - DOWN
        timestamp:
          type: string
          format: date-time
        gateways:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum:
                - UP
                - DEGRADED
                - DOWN
              latencyMs:
                type: integer
