    PaymentStatus:
      type: string
      enum:
      - CREATED
      - REQUIRES_ACTION
      - PENDING
      - PROCESSING
      - UNDER_REVIEW
      - COMPLETED
      - FAILED
      - CANCELLED
      - EXPIRED
      - PARTIALLY_REFUNDED
      - REFUNDED
    CustomerInfo:
      type: object
      properties:
        name:
          type: string
          example: Tanvir Ahmed
        email:
          type: string
