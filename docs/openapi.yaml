          example: tanvir@example.com
        phone:
          type: string
          example: 01712345678
        billingAddress:
          type: object
          properties:
            street:
              type: string
            city:
              type: string
            postalCode:
              type: string
            country:
              type: string
              default: BD
    CreatePaymentRequest:
      type: object
      required:
      - amountPaisa
      - currency
      properties:
        amountPaisa:
          type: string
          description: Integer minor units (paisa). 150000 = 1,500.00 BDT.
          pattern: ^[1-9][0-9]*$
          example: '150000'
        currency:
          type: string
          enum:
          - BDT
          default: BDT
        provider:
          type: string
          enum:
          - BKASH
          - NAGAD
          - ROCKET
          - UPAY
          - SSLCOMMERZ
          - SHURJOPAY
          - AAMARPAY
          - MOCK
          default: BKASH
        customer:
          $ref: '#/components/schemas/CustomerInfo'
        description:
          type: string
          maxLength: 255
          example: 'Invoice #1042 Payment'
        redirectUrl:
          type: string
          format: uri
          example: https://merchant.example.com/checkout/return
        metadata:
          type: object
          additionalProperties: true
    PaymentResponse:
      type: object
      required:
      - id
      - merchantId
      - amountPaisa
      - feePaisa
      - refundedAmountPaisa
      - currency
      - status
      - createdAt
      properties:
        id:
          type: string
          example: pay_a1b2c3d4e5f6
        merchantId:
          type: string
          example: mch_test123
        amountPaisa:
          type: string
          example: '150000'
        feePaisa:
          type: string
          example: '2250'
        refundedAmountPaisa:
          type: string
          example: '0'
        currency:
          type: string
          example: BDT
        status:
          $ref: '#/components/schemas/PaymentStatus'
        provider:
          type: string
          example: BKASH
        redirectUrl:
          type: string
          example: https://checkout.denaneya.com/pay/pay_a1b2c3d4e5f6
        riskScore:
          type: integer
          example: 12
        idempotencyKey:
          type: string
          example: idem_abc123
        createdAt:
          type: string
          format: date-time
    PaymentListItem:
      type: object
      required:
      - id
      - merchantId
      - amountPaisa
      - currency
      - status
      - createdAt
      properties:
        id:
          type: string
        merchantId:
          type: string
        amountPaisa:
          type: string
        feePaisa:
          type: string
        refundedAmountPaisa:
          type: string
        currency:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        provider:
          type: string
        providerTrxId:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        riskScore:
          type: integer
        settledAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PaymentDetailResponse:
      allOf:
      - $ref: '#/components/schemas/PaymentResponse'
