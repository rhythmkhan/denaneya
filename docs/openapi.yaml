          type: string
    WebhookCreatedResponse:
      type: object
      required:
      - id
      - merchantId
      - url
      - events
      - secret
      - status
      - createdAt
      properties:
        id:
          type: string
        merchantId:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        secret:
          type: string
          description: HMAC-SHA256 signature secret. Disclosed ONLY ONCE upon creation.
          example: whsec_9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
