      type: object
      properties:
        batchId:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        provider:
          type: string
          enum:
          - BKASH
          - NAGAD
          - ROCKET
          - UPAY
          - SSLCOMMERZ
          - SHURJOPAY
          - AAMARPAY
        merchantId:
          type: string
        autoHeal:
          type: boolean
          default: false
        content:
          type: string
          description: Raw or base64 statement content for direct batch parsing
        batchReference:
          type: string
        feeTolerancePaisa:
          type: string
          pattern: ^[0-9]+$
        expectedMdrBps:
          type: integer
    ReconciliationJobResponse:
      type: object
      required:
      - runId
      - status
      - metrics
      - discrepancies
      properties:
        runId:
          type: string
          example: rec_run_01j7v04x
        batchId:
          type: string
          example: batch_ssl_20260914
        status:
          type: string
          enum:
          - MATCHED
          - DISCREPANCIES_DETECTED
          - FAILED
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        metrics:
          type: object
          required:
          - totalRecordsEvaluated
          - matchedCount
          - discrepancyCount
          - autoHealedCount
          - totalInternalAmountBDT
          - totalProviderAmountBDT
          - totalLedgerAmountBDT
          - netDiscrepancyAmountBDT
          - breakdown
          properties:
            totalRecordsEvaluated:
              type: integer
            matchedCount:
              type: integer
            discrepancyCount:
              type: integer
            autoHealedCount:
              type: integer
            totalInternalAmountBDT:
              type: string
              example: '1500.00'
            totalProviderAmountBDT:
              type: string
              example: '1500.00'
            totalLedgerAmountBDT:
              type: string
              example: '1500.00'
            netDiscrepancyAmountBDT:
              type: string
              example: '0.00'
            breakdown:
              type: object
              additionalProperties:
                type: integer
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationDiscrepancyDetail'
    ReconciliationDiscrepancyDetail:
      type: object
      required:
      - id
      - type
      - provider
      - discrepancyAmountBDT
      - resolutionStatus
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - MATCHED
          - AMOUNT_MISMATCH
          - STATUS_MISMATCH
          - MISSING_IN_LEDGER
          - MISSING_IN_GATEWAY
          - UNEXPECTED_GATEWAY_TX
          - FEE_DISCREPANCY
        paymentId:
          type: string
        providerTrxId:
          type: string
        provider:
          type: string
        merchantId:
          type: string
        internalAmountBDT:
          type: string
        providerAmountBDT:
          type: string
        ledgerAmountBDT:
          type: string
        discrepancyAmountBDT:
          type: string
        internalStatus:
          type: string
        providerStatus:
          type: string
        resolutionStatus:
          type: string
          enum:
          - UNRESOLVED
          - AUTO_RESOLVED
          - MANUALLY_RESOLVED
          - DISMISSED
        notes:
          type: string
