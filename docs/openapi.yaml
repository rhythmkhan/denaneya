      - amountPaisa
      - currency
      - status
      - createdAt
      properties:
        id:
          type: string
          example: ref_12345
        paymentId:
          type: string
          example: pay_a1b2c3d4e5f6
        amountPaisa:
          type: string
          example: '50000'
        currency:
          type: string
          example: BDT
        status:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
